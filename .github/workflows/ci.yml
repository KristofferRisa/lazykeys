name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      - name: dist/ is up to date
        run: |
          if ! git diff --exit-code --stat dist; then
            echo "::error::dist/ is stale. Run 'pnpm build' and commit the result."
            exit 1
          fi
          untracked=$(git ls-files --others --exclude-standard dist)
          if [ -n "$untracked" ]; then
            echo "::error::dist/ has files that are not committed:"
            echo "$untracked"
            exit 1
          fi
